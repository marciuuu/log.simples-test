name: Sync Notion & Deploy Quartz v4

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Notion Dependencies
        run: npm install @notionhq/client notion-to-md

      # 1. Puxa o conteúdo atualizado do Notion
      - name: Fetch and Convert Notion Content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          node -e '
          const { Client } = require("@notionhq/client");
          const { NotionToMarkdown } = require("notion-to-md");
          const fs = require("fs");
          const path = require("path");

          const notion = new Client({ auth: process.env.NOTION_TOKEN });
          const n2m = new NotionToMarkdown({ notionClient: notion });

          async function main() {
            const rawId = process.env.NOTION_PAGE_ID.replace(/-/g, "");
            const outDir = path.join(process.cwd(), "content");
            if (!fs.existsSync(outDir)) fs.mkdirSync(outDir, { recursive: true });

            console.log("Sincronizando página raiz do Notion...");
            const mdblocks = await n2m.pageToMarkdown(rawId);
            const mdResult = n2m.toMarkdownString(mdblocks);
            const content = typeof mdResult === "string" ? mdResult : (mdResult.parent || "");

            // Salva como index.md para ser a página inicial do Quartz
            const frontmatter = "---\ntitle: Home\n---\n\n";
            fs.writeFileSync(path.join(outDir, "index.md"), frontmatter + content);
            console.log("Página inicial salva com sucesso em content/index.md");
          }

          main().catch(err => {
            console.error("Erro na sincronização:", err);
            process.exit(1);
          });
          '

      # 2. Salva o markdown atualizado no git
      - name: Commit Notion Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: sync latest Notion notes [skip ci]" && git push)

      # 3. Clona e Executa o Quartz v4
      - name: Setup Quartz
        run: |
          npx quartz create -d . -s empty || true
          npm install

      - name: Build Quartz Site
        run: npx quartz build

      # 4. Envia o build para o GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
